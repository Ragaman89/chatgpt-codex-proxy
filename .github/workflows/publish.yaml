name: Publish images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: [self-hosted, linux, registry-laegerfeld]
    strategy:
      matrix:
        include:
          - image: chatgpt-codex-proxy
            dockerfile: Dockerfile
          - image: chatgpt-codex-compressor
            dockerfile: Dockerfile.compressor
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Reject an existing release tag
        env:
          IMAGE: registry.laegerfeld.de/${{ matrix.image }}
          TAG: ${{ github.ref_name }}
        run: |
          set +e
          output="$(docker buildx imagetools inspect "$IMAGE:$TAG" 2>&1)"
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "Refusing to overwrite existing image: $IMAGE:$TAG" >&2
            exit 1
          fi
          if ! grep -Eiq "manifest unknown|name unknown|not found" <<< "$output"; then
            echo "Unable to verify that $IMAGE:$TAG is unused" >&2
            echo "$output" >&2
            exit 1
          fi
      - name: Build and publish immutable multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64,linux/amd64
          push: true
          tags: registry.laegerfeld.de/${{ matrix.image }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true