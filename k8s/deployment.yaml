apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-proxy
  namespace: codex-proxy
  labels:
    app.kubernetes.io/name: codex-proxy
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: codex-proxy
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codex-proxy
        app.kubernetes.io/component: gateway
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: registry.laegerfeld.de/chatgpt-codex-proxy:0000000000000000000000000000000000000000
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: /data
            - name: PROXY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: codex-proxy
                  key: proxy-api-key
            - name: TOKEN_OPTIMIZATION_ENABLED
              value: "true"
            - name: TOKEN_COMPRESSOR_URL
              value: http://llmlingua-compressor:8090
            - name: TOKEN_COMPRESSOR_TIMEOUT
              value: 8s
            - name: TOKEN_COMPRESSION_MIN_REQUEST_TOKENS
              value: "6000"
            - name: TOKEN_COMPRESSION_MIN_TEXT_TOKENS
              value: "800"
            - name: TOKEN_COMPRESSION_TARGET_RATIO
              value: "0.50"
            - name: TOKEN_COMPRESSION_CACHE_ENTRIES
              value: "256"
            - name: TOKEN_AUTO_COMPACT_THRESHOLD
              value: "120000"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: codex-proxy-data
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmlingua-compressor
  namespace: codex-proxy
  labels:
    app.kubernetes.io/name: llmlingua-compressor
    app.kubernetes.io/component: compressor
    temporary: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: llmlingua-compressor
      app.kubernetes.io/component: compressor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llmlingua-compressor
        app.kubernetes.io/component: compressor
        temporary: "true"
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
        temporary: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: compressor
          image: registry.laegerfeld.de/chatgpt-codex-compressor:0000000000000000000000000000000000000000
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8090"
            - name: MODEL_NAME
              value: /models/llmlingua-2-bert-base-multilingual-cased-meetingbank
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          ports:
            - name: http
              containerPort: 8090
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "4"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
