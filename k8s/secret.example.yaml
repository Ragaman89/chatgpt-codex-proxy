apiVersion: v1
kind: Secret
metadata:
  name: codex-proxy
  namespace: codex-proxy
type: Opaque
stringData:
  # Replace before applying. This key protects API and admin endpoints.
  proxy-api-key: replace-with-a-long-random-value
---
apiVersion: v1
kind: Secret
metadata:
  name: codex-proxy-mqtt
  namespace: codex-proxy
type: Opaque
stringData:
  # MQTT discovery reporting is disabled when HA_MQTT_BROKER is unset.
  broker: tcp://mqtt.example.internal:1883
  username: replace-with-mqtt-username
  password: replace-with-mqtt-password
